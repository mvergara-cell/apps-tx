<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>CRM Comercial TX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
[hidden]{display:none!important}
html,body{margin:0}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
/* Layout: app shell — sidebar on desktop, bottom tab bar + FAB on phones; concrete-grey neutrals, TX blue accent, amber for attention */
:root{
  --bg:#eef0f2; --panel:#ffffff; --panel-2:#f6f7f8; --line:#d9dde2; --line-2:#e7eaee;
  --fg:#15191e; --fg-2:#4a525c; --fg-3:#737c87;
  --accent:#1d4f91; --accent-2:#e3ecf8; --accent-fg:#ffffff;
  --amber:#b86e00; --amber-bg:#fdf1dc; --good:#1f7a3f; --good-bg:#e2f3e7; --bad:#b3261e; --bad-bg:#fbe5e3; --info:#2a64b0; --info-bg:#e5eefb;
  --warn2:#c2410c; --warn2-bg:#fde8dc;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --land:#e4e1d8; --sea:#dce7f1; --shadow:0 1px 2px rgba(20,30,45,.06),0 4px 16px rgba(20,30,45,.06);
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111418; --panel:#191d22; --panel-2:#1f242a; --line:#2e353d; --line-2:#262c33;
  --fg:#eef1f4; --fg-2:#b7bfc8; --fg-3:#8a939d;
  --accent:#6fa3e8; --accent-2:#1d2d44; --accent-fg:#0d1624;
  --amber:#f0b04a; --amber-bg:#3a2b12; --good:#5cc983; --good-bg:#16301f; --bad:#f08079; --bad-bg:#3a1a18; --info:#7fb0f0; --info-bg:#1a2a40;
  --warn2:#f59a66; --warn2-bg:#3b2215;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --land:#262a2f; --sea:#161c24; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111418; --panel:#191d22; --panel-2:#1f242a; --line:#2e353d; --line-2:#262c33;
  --fg:#eef1f4; --fg-2:#b7bfc8; --fg-3:#8a939d;
  --accent:#6fa3e8; --accent-2:#1d2d44; --accent-fg:#0d1624;
  --amber:#f0b04a; --amber-bg:#3a2b12; --good:#5cc983; --good-bg:#16301f; --bad:#f08079; --bad-bg:#3a1a18; --info:#7fb0f0; --info-bg:#1a2a40;
  --warn2:#f59a66; --warn2-bg:#3b2215;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --land:#262a2f; --sea:#161c24; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.005em;margin:0;text-wrap:balance}
h1{font-size:1.65rem;line-height:1.15} h2{font-size:1.2rem} h3{font-size:1.02rem}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--fg-3)} .small{font-size:.85rem}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{background:var(--panel);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;padding:14px 10px 20px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.brand .mk{width:34px;height:34px;border-radius:6px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.02em}
.brand b{font-family:var(--f-display);font-size:1.1rem;display:block;line-height:1} .brand span{font-size:.72rem;color:var(--fg-3);text-transform:uppercase;letter-spacing:.08em}
.nav-g{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--fg-3);padding:12px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:var(--fg-2);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--panel-2);color:var(--fg)}
.nav a.on{background:var(--accent-2);color:var(--accent);font-weight:600}
.nav svg{width:18px;height:18px;flex:none}
.nav .cnt{margin-left:auto;font-size:.72rem;background:var(--amber-bg);color:var(--amber);border-radius:99px;padding:0 7px;font-weight:600}
.main-wrap{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;padding-block:10px;padding-inline:20px}
.search{position:relative;flex:1;max-width:520px;min-width:0}
.search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--fg-3)}
.sres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:420px;overflow:auto;z-index:40;padding:6px}
.sres .g{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-3);padding:8px 8px 2px}
.sres button{display:flex;width:100%;text-align:left;gap:8px;justify-content:space-between;padding:7px 8px;border:0;background:none;border-radius:6px;cursor:pointer}
.sres button:hover,.sres button:focus{background:var(--panel-2)}
.who{display:flex;align-items:center;gap:8px;margin-left:auto}
.who select{padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);max-width:230px}
.bell{position:relative;border:1px solid var(--line);background:var(--panel);width:38px;height:38px;border-radius:8px;display:grid;place-items:center;cursor:pointer}
.bell svg{width:18px;height:18px}
.bell i{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;font-style:normal;font-size:.68rem;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.notif{position:absolute;right:20px;top:58px;width:min(380px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:45;max-height:70vh;overflow:auto}
.notif h3{padding:12px 14px;border-bottom:1px solid var(--line)}
.notif .it{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line-2);cursor:pointer}
.notif .it:hover{background:var(--panel-2)}
main{padding-block:20px 90px;padding-inline:20px;min-width:0;max-width:1320px;width:100%}
.demo-strip{font-size:.78rem;color:var(--fg-3);padding:0 20px 0;margin-top:6px}

/* building blocks */
.ph{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.ph p{margin:4px 0 0;color:var(--fg-2)}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--fg-3);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);padding:8px 13px;border-radius:7px;cursor:pointer;font-weight:600;font-size:.9rem;white-space:nowrap;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--fg-3)}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.bad{background:var(--panel);border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:.82rem}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card>h2,.card>h3{margin-bottom:10px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.kpi .l{font-size:.78rem;color:var(--fg-2);font-weight:500}
.kpi .v{font-family:var(--f-display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .d{font-size:.76rem;color:var(--fg-3)}
.kpi.alert{border-color:var(--amber);background:var(--amber-bg)}
.quick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:16px}
.quick button{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;text-align:left;font-weight:600;min-width:0}
.quick button:hover{border-color:var(--accent)}
.quick button svg{width:22px;height:22px;color:var(--accent)}
.quick button.main-q{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)} .quick button.main-q svg{color:var(--accent-fg)}
.tbl-w{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{text-align:left;font-weight:600;font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-3);padding:9px 12px;border-bottom:1px solid var(--line);background:var(--panel-2);white-space:nowrap}
th.s{cursor:pointer} th.s:hover{color:var(--fg)}
td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--panel-2)}
td.r,th.r{text-align:right}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:.76rem;font-weight:600;white-space:nowrap;background:var(--panel-2);color:var(--fg-2);border:1px solid var(--line)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.nodot::before{display:none}
.st-borrador{color:var(--fg-2)} .st-enviada{background:var(--info-bg);color:var(--info);border-color:transparent}
.st-negociacion{background:var(--accent-2);color:var(--accent);border-color:transparent}
.st-pendiente{background:var(--amber-bg);color:var(--amber);border-color:transparent}
.st-ganada{background:var(--good-bg);color:var(--good);border-color:transparent}
.st-perdida{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.st-vencida{background:var(--panel-2);color:var(--fg-3);text-decoration:line-through}
.age-ok{background:var(--good-bg);color:var(--good);border-color:transparent}
.age-30{background:var(--amber-bg);color:var(--amber);border-color:transparent}
.age-60{background:var(--warn2-bg);color:var(--warn2);border-color:transparent}
.age-90{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line);font-size:.8rem}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.filters input,.filters select{padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel);min-width:0}
.filters input[type=search]{flex:1;min-width:200px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;font-weight:600;color:var(--fg-3);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.tabs button .c{font-family:var(--f-mono);font-size:.75rem;margin-left:4px;color:var(--fg-3)}
.list-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line-2)}
.list-item:last-child{border-bottom:0}
.list-item .grow{flex:1;min-width:0}
.ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--panel-2);color:var(--fg-2)}
.ic svg{width:17px;height:17px}
.ic.v{background:var(--accent-2);color:var(--accent)} .ic.q{background:var(--info-bg);color:var(--info)} .ic.w{background:var(--good-bg);color:var(--good)} .ic.l{background:var(--bad-bg);color:var(--bad)} .ic.t{background:var(--amber-bg);color:var(--amber)}
.empty{padding:26px;text-align:center;color:var(--fg-3)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.9rem}
.kv dt{color:var(--fg-3)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.note{background:var(--info-bg);color:var(--fg);border-radius:8px;padding:10px 12px;font-size:.86rem;display:flex;gap:8px}
.note.warn{background:var(--amber-bg)}
.avatar{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:.72rem;font-weight:700;color:#fff;flex:none}

/* forms */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.form .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:.8rem;font-weight:600;color:var(--fg-2)}
.fld label .req{color:var(--bad)}
.fld input,.fld select,.fld textarea{padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel);width:100%;min-width:0}
.fld textarea{min-height:74px;resize:vertical}
.fld .hint{font-size:.76rem;color:var(--fg-3)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;gap:6px;align-items:center;padding:5px 9px;border:1px solid var(--line);border-radius:7px;font-weight:500;cursor:pointer;font-size:.86rem;color:var(--fg)}
.sect{font-family:var(--f-display);font-weight:700;font-size:1rem;grid-column:1/-1;margin-top:6px;padding-top:10px;border-top:1px solid var(--line-2)}

/* modal */
.ov{position:fixed;inset:0;background:rgba(10,15,22,.45);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto}
.modal{background:var(--panel);border-radius:12px;width:min(760px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;max-width:100%}
.modal.wide{width:min(1000px,100%)}
.modal.narrow{width:min(520px,100%)}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mb{padding:18px;min-width:0}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{border:0;background:none;cursor:pointer;font-size:1.4rem;line-height:1;color:var(--fg-3);padding:4px 8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:9px;z-index:80;font-weight:500;box-shadow:var(--shadow);max-width:calc(100vw - 32px);display:flex;gap:12px;align-items:center}
.toast button{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;font-weight:600}

/* quote editor */
.qitems td{vertical-align:middle}
.qitems input,.qitems select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);width:100%}
.qitems .w-q{width:84px} .qitems .w-p{width:110px} .qitems .w-d{width:70px}
.chg{outline:2px solid var(--amber);outline-offset:-1px}
.totals{margin-left:auto;width:min(340px,100%);display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:.92rem}
.totals .T{font-family:var(--f-display);font-size:1.35rem;font-weight:700;border-top:1px solid var(--line);padding-top:6px}
.stat-actions{display:flex;flex-wrap:wrap;gap:8px}

/* pdf sheet */
.sheet{background:#fff;color:#1b1f24;width:100%;max-width:794px;margin:0 auto;padding:40px 44px;font-family:var(--f-body);font-size:12.5px;box-shadow:0 2px 14px rgba(0,0,0,.15);color-scheme:light}
.sheet .hd{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid #1d4f91;padding-bottom:14px}
.sheet .logo{display:flex;gap:10px;align-items:center}
.sheet .logo .m{width:46px;height:46px;background:#1d4f91;color:#fff;border-radius:6px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:19px}
.sheet h4{margin:0 0 4px;font-family:var(--f-display);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#1d4f91}
.sheet table{font-size:11.5px} .sheet th{background:#1d4f91;color:#fff;font-size:10.5px;border:0} .sheet td{border-bottom:1px solid #e3e6ea;color:#1b1f24}
.sheet .box{border:1px solid #d9dde2;border-radius:6px;padding:10px 12px}
.sheet .tot{margin-left:auto;width:260px}
.sheet .tot div{display:flex;justify-content:space-between;padding:3px 0}
.sheet .tot .T{border-top:2px solid #1d4f91;font-weight:700;font-size:14px;padding-top:6px;margin-top:4px}
.sheet-wrap{background:var(--panel-2);padding:16px;border-radius:8px;overflow-x:auto}

/* pipeline */
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:200px;display:flex;flex-direction:column;gap:8px}
.col.drag{outline:2px dashed var(--accent)}
.col-h{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.col-h b{font-family:var(--f-display);font-size:1rem}
.opp{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:grab;display:flex;flex-direction:column;gap:6px}
.opp:hover{border-color:var(--fg-3)}
.opp select{padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-size:.8rem}

/* map */
.map-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px}
.map-box{background:var(--sea);border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative}
.mk-c{cursor:pointer} .mk-c:hover{stroke-width:3}
.map-tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.82rem;box-shadow:var(--shadow);max-width:240px;z-index:5}

/* charts */
.chart text{fill:var(--fg-2);font-family:var(--f-body);font-size:11px}
.chart .grid-l{stroke:var(--line-2);stroke-width:1}
.chart .axis{stroke:var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--fg-2);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.hbar{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:6px 10px;align-items:center;font-size:.86rem}
.hbar .b{height:12px;border-radius:0 4px 4px 0;background:var(--s1);min-width:2px}
.hbar .track{background:var(--panel-2);border-radius:0 4px 4px 0;height:12px}

/* proposal */
.prop h2{margin:26px 0 10px;font-size:1.35rem}
.prop h3{margin:14px 0 6px}
.prop p,.prop li{max-width:72ch;color:var(--fg-2)}
.arch{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:stretch}
.arch .layer{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel)}
.arch .layer b{font-family:var(--f-display);display:block;margin-bottom:4px}
.arch .layer ul{margin:6px 0 0;padding-left:18px;font-size:.86rem}
.arch .layer.hl{border-color:var(--accent);background:var(--accent-2)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flow .n{padding:8px 12px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:.88rem}
.flow .a{color:var(--fg-3)}
.erd{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.erd .t{border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden;font-size:.8rem}
.erd .t b{display:block;background:var(--panel-2);padding:6px 10px;font-family:var(--f-mono);font-size:.82rem;border-bottom:1px solid var(--line)}
.erd .t div{padding:3px 10px;font-family:var(--f-mono);color:var(--fg-2)}
.erd .t .k{color:var(--accent)} .erd .t .f{color:var(--amber)}

/* mobile */
.bnav{display:none}
.fab{display:none}
@media (max-width:1100px){.quick{grid-template-columns:repeat(3,minmax(0,1fr))}.map-wrap{grid-template-columns:1fr}.arch{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .side.open{display:flex;position:fixed;inset:0 25% 0 0;z-index:70;height:100%;box-shadow:var(--shadow)}
  .g2,.g3,.g-main{grid-template-columns:1fr}
  .top{padding-inline:16px}
  main{padding-inline:16px}
  .who select{max-width:140px}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom,0px)}
  .bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:.68rem;color:var(--fg-3);cursor:pointer;font-weight:600}
  .bnav button.on{color:var(--accent)}
  .bnav svg{width:21px;height:21px}
  .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-fg);border:0;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:31;cursor:pointer}
  .fab svg{width:24px;height:24px}
  .form{grid-template-columns:1fr}
  .hide-m{display:none}
  .sheet{padding:22px 18px}
  .arch{grid-template-columns:1fr}
}
@media (max-width:520px){.who select{max-width:118px;font-size:.8rem}.quick{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .v{font-size:1.3rem}.search{max-width:none}.who .lbl{display:none}}
.menu-btn{display:none;border:1px solid var(--line);background:var(--panel);width:38px;height:38px;border-radius:8px;place-items:center;cursor:pointer}
@media (max-width:860px){.menu-btn{display:grid}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.gate{min-height:100%;display:grid;place-items:center;padding:24px 16px;background:var(--bg)}
.gate-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px;width:min(400px,100%);display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.gate-card .brand{padding:0}
.gate-card .fld input{padding:11px 12px}
.userbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 10px 4px 5px;cursor:pointer;max-width:230px;text-align:left}
.userbtn .un{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.userbtn .un b{font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.userbtn .un span{font-size:.72rem;color:var(--fg-3)}
.umenu{position:absolute;right:20px;top:58px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:46;min-width:220px;padding:6px}
.umenu button{display:flex;gap:8px;align-items:center;width:100%;border:0;background:none;padding:9px 10px;border-radius:6px;cursor:pointer;text-align:left}
.umenu button:hover{background:var(--panel-2)}
.umenu svg{width:16px;height:16px}
.umenu .hd{padding:8px 10px 10px;border-bottom:1px solid var(--line-2);margin-bottom:4px;font-size:.84rem}
#syncDot{width:9px;height:9px;border-radius:50%;background:var(--good);flex:none}
#syncDot[data-state=busy]{background:var(--amber)}
.cmk{display:block;width:14px;height:14px;border:3.5px solid;border-radius:3px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.leaflet-container{font-family:var(--f-body)}
@media (max-width:520px){.userbtn .un{display:none}.userbtn{padding:4px}}
</style>
</head>

<div class="app" hidden>
  <aside class="side" id="side"></aside>
  <div class="main-wrap">
    <header class="top">
      <button class="menu-btn" id="menuBtn" aria-label="Abrir menú"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>

function kpi(l,v,d,alert){return `<div class="kpi ${alert?'alert':''}"><div class="l">${l}</div><div class="v">${v}</div><div class="d">${d||''}</div></div>`}
function taskRow(t){const c=C(t.clientId);const late=t.date<ymd(TODAY);return `<div class="list-item"><input type="checkbox" aria-label="Completar" data-task-done="${t.id}" ${t.done?'checked':''} style="margin-top:9px;width:18px;height:18px"><div class="ic t">${ico(t.type==='llamada'?'phone':t.type==='visita'?'pin':t.type==='seguimiento'?'doc':'cal')}</div><div class="grow"><b>${esc(t.title)}</b><div class="small muted">${c?`<a href="#cliente/${c.id}">${esc(c.name)}</a> · `:''}${fds(t.date)} ${t.time||''} ${me().role!=='vendedor'?'· '+esc(U(t.userId).name):''}</div></div>${late?'<span class="pill age-90">Vencida</span>':t.date===ymd(TODAY)?'<span class="pill age-30">Hoy</span>':''}</div>`}
function teamTable(from){
 const rows=S.users.filter(u=>u.role==='vendedor').map(u=>{const vs=S.visits.filter(v=>v.userId===u.id&&v.date>=from);const qs=S.quotes.filter(q=>q.userId===u.id&&q.date>=from);const w=S.quotes.filter(q=>q.userId===u.id&&q.won&&q.won.date>=from);return{u,v:vs.length,q:qs.length,cot:qs.reduce((s,q)=>s+qTotals(q).total,0),won:w.reduce((s,q)=>s+q.won.amount,0),sin:S.clients.filter(c=>c.sellers.includes(u.id)&&daysSince(c.id)>=S.cfg.alerts[1]).length}});
 return `<div class="tbl-w"><table><thead><tr><th>Vendedor</th><th class="r">Visitas</th><th class="r">Cotizaciones</th><th class="r">Monto cotizado</th><th class="r">Monto ganado</th><th class="r">Clientes +${S.cfg.alerts[1]} días</th></tr></thead><tbody>${rows.map(r=>`<tr><td><span class="row">${avatar(r.u)}${esc(r.u.name)}</span></td><td class="r num">${r.v}</td><td class="r num">${r.q}</td><td class="r num">${clp(r.cot)}</td><td class="r num">${clp(r.won)}</td><td class="r">${r.sin?`<span class="pill age-60">${r.sin}</span>`:'<span class="muted">0</span>'}</td></tr>`).join('')}</tbody></table></div>`;
}

let CF={q:'',region:'',seller:'',age:'',seg:'',sort:'name'};
function vClients(){
 const cl=visibleClients();
 const sellers=S.users.filter(u=>u.role==='vendedor');
 M().innerHTML=`<div class="ph"><div><h1>${can('ver_todo')?'Clientes':'Mis clientes'}</h1><p>${cl.length} clientes${can('ver_todo')?'':' asignados a ti'}. Busca por nombre, RUT, razón social, comuna o contacto.</p></div>
 <div class="row">${can('exportar')?`<button class="btn" data-act="export" data-what="clientes">${ico('dl')}Exportar</button>`:''}${can('crear_cliente')?`<button class="btn pri" data-act="newClient">${ico('plus')}Nuevo cliente</button>`:''}</div></div>
 <div class="filters">
  <input type="search" id="cf-q" placeholder="Nombre, RUT, razón social, contacto…" value="${esc(CF.q)}">
  <select id="cf-region"><option value="">Todas las regiones</option>${REGIONS.map(r=>`<option value="${r.id}" ${CF.region===r.id?'selected':''}>${r.name}</option>`).join('')}</select>
  ${can('ver_todo')?`<select id="cf-seller"><option value="">Todos los vendedores</option>${sellers.map(u=>`<option value="${u.id}" ${CF.seller===u.id?'selected':''}>${u.name}</option>`).join('')}</select>`:''}
  <select id="cf-age"><option value="">Última visita: todas</option>${S.cfg.alerts.map(a=>`<option value="${a}" ${CF.age==a?'selected':''}>Sin visita +${a} días</option>`).join('')}</select>
  <select id="cf-seg"><option value="">Segmento: todos</option>${['A','B','C'].map(s=>`<option ${CF.seg===s?'selected':''}>${s}</option>`).join('')}</select>
 </div><div id="cl-table"></div>`;
 const draw=()=>{
  let rows=cl.filter(c=>{const q=norm(CF.q);if(q&&!norm([c.name,c.razon,c.rut,c.comuna,c.email,c.contacts.map(x=>x.name).join(' ')].join(' ')).includes(q))return false;if(CF.region&&c.region!==CF.region)return false;if(CF.seller&&!c.sellers.includes(CF.seller))return false;if(CF.age&&daysSince(c.id)<+CF.age)return false;if(CF.seg&&c.segment!==CF.seg)return false;return true});
  const sorters={name:(a,b)=>a.name.localeCompare(b.name),days:(a,b)=>daysSince(b.id)-daysSince(a.id),region:(a,b)=>a.region.localeCompare(b.region)||a.comuna.localeCompare(b.comuna)};
  rows.sort(sorters[CF.sort]);
  $('#cl-table').innerHTML=rows.length?`<div class="tbl-w"><table><thead><tr><th class="s" data-sort="name">Cliente ↕</th><th class="hide-m">RUT</th><th class="s" data-sort="region">Región / comuna ↕</th><th class="hide-m">Vendedor</th><th class="s" data-sort="days">Última visita ↕</th><th class="hide-m">Última cotización</th></tr></thead><tbody>${rows.map(c=>{const lq=lastQuote(c.id);const lv=lastVisit(c.id);return `<tr class="click" data-go="#cliente/${c.id}"><td><b>${esc(c.name)}</b> <span class="chip" title="Segmento">${c.segment}</span><div class="small muted">${esc(c.type)}</div></td><td class="hide-m mono small">${c.rut}</td><td>${esc(c.comuna)}<div class="small muted">${regName(c.region)}</div></td><td class="hide-m"><span class="row">${c.sellers.map(avatar).join('')}</span></td><td>${agePill(daysSince(c.id))}<div class="small muted">${lv?fd(lv.date.slice(0,10)):''}</div></td><td class="hide-m">${lq?`<span class="mono small">${lq.num}</span><br>${stPill(lq)}`:'<span class="muted">—</span>'}</td></tr>`}).join('')}</tbody></table></div><p class="small muted">${rows.length} de ${cl.length} clientes</p>`:'<div class="card empty">No hay clientes que coincidan con los filtros.</div>';
 };
 draw();
 M().oninput=e=>{const id=e.target.id;if(id&&id.startsWith('cf-')){CF[id.slice(3)]=e.target.value;draw()}};
 M().onchange=M().oninput;
 M().onclick=e=>{const s=e.target.closest('[data-sort]');if(s){CF.sort=s.dataset.sort;draw()}};
}

 M().innerHTML=`<div class="ph"><div><h1>Clientes por visitar</h1><p>Clientes que superan los umbrales de días sin visita configurados (${S.cfg.alerts.join(' / ')} días).</p></div>${can('config')?`<a class="btn" href="#admin">${ico('gear')}Configurar umbrales</a>`:''}</div>
 <div class="kpis">${S.cfg.alerts.map((a,i)=>kpi(`Sin visita +${a} días`,cnt(a),i===0?'incluye los siguientes tramos':'',i===2&&cnt(a)>0)).join('')}</div>

/* client 360 */
let C360tab='todo';
function vClient(id){
 const c=C(id);if(!c){M().innerHTML='<div class="card empty">Cliente no encontrado.</div>';return}
 if(!can('ver_todo')&&!c.sellers.includes(S.me)){M().innerHTML=noPerm('este cliente (asignado a otro vendedor)');return}
 const qs=S.quotes.filter(q=>q.clientId===id).sort((a,b)=>b.date.localeCompare(a.date));
 const vs=S.visits.filter(v=>v.clientId===id).sort((a,b)=>b.date.localeCompare(a.date));
 const ops=S.opps.filter(o=>o.clientId===id);const ts=S.tasks.filter(t=>t.clientId===id&&!t.done).sort((a,b)=>a.date.localeCompare(b.date));
 const cm=S.comms.filter(m=>m.clientId===id);
 const won=qs.filter(q=>q.status==='ganada');const cot=qs.reduce((s,q)=>s+qTotals(q).total,0);const wonAmt=won.reduce((s,q)=>s+q.won.amount,0);
 const closed=qs.filter(q=>['ganada','perdida'].includes(q.status));
 const d=daysSince(id);const L=listFor(c);
 const tl=[...vs.map(v=>({ts:v.date,k:'v',t:'Visita · '+v.reason,s:v.result+' — '+v.comments,u:v.userId,link:null,extra:v})),
  ...qs.map(q=>({ts:q.createdAt,k:'q',t:`Cotización ${q.num} · ${clp(qTotals(q).total)}`,s:STATUS[qStatus(q)],u:q.userId,link:'#cotizacion/'+q.id})),
  ...won.map(q=>({ts:q.won.date+'T18:00',k:'w',t:`Pedido ${q.won.order} · ${clp(q.won.amount)}`,s:'Cotización '+q.num+' ganada',u:q.userId,link:'#cotizacion/'+q.id})),
  ...qs.filter(q=>q.lost).map(q=>({ts:q.lost.date+'T18:00',k:'l',t:`Cotización ${q.num} perdida`,s:'Motivo: '+q.lost.reason,u:q.userId,link:'#cotizacion/'+q.id})),
  ...cm.map(m=>({ts:m.date,k:'m',t:m.channel,s:m.text,u:m.userId})),
  ...S.audit.filter(a=>a.entity==='Cliente'&&a.ref===c.name).map(a=>({ts:a.ts,k:'a',t:a.action,s:a.detail,u:a.user}))
 ].sort((a,b)=>b.ts.localeCompare(a.ts));
 const filt={todo:()=>true,v:x=>x.k==='v',q:x=>x.k==='q'||x.k==='w'||x.k==='l',m:x=>x.k==='m',a:x=>x.k==='a'};
 const icmap={v:['v','pin'],q:['q','doc'],w:['w','check'],l:['l','x'],m:['','phone'],a:['','hist']};
 M().innerHTML=`
 <div class="ph"><div><div class="eyebrow"><a href="#clientes">Clientes</a> / ficha 360°</div><h1>${esc(c.name)}</h1>
  <p class="row"><span class="mono small">${c.rut}</span><span class="chip">Segmento ${c.segment}</span><span class="chip">${esc(c.type)}</span><span class="chip">${esc(c.comuna)}, ${regName(c.region)}</span>${agePill(d)}</p></div>
  <div class="row">${can('registrar_visita')?`<button class="btn pri" data-act="newVisit" data-client="${id}">${ico('pin')}Registrar visita</button>`:''}${can('cotizar')?`<button class="btn" data-act="newQuote" data-client="${id}">${ico('doc')}Nueva cotización</button>`:''}<button class="btn" data-act="newTask" data-client="${id}">${ico('cal')}Actividad</button><button class="btn" data-act="newComm" data-client="${id}">${ico('phone')}Comunicación</button>${can('crear_cliente')?`<button class="btn ghost" data-act="editClient" data-id="${id}">${ico('edit')}Editar</button>`:''}</div></div>
 <div class="kpis">${kpi('Monto cotizado',clpK(cot),qs.length+' cotizaciones')}${kpi('Ventas ganadas',clpK(wonAmt),won.length+' pedidos')}${kpi('Conversión',pct(closed.length?won.length/closed.length:NaN),'sobre cotizaciones cerradas')}${kpi('Visitas',vs.length,vs[0]?'última '+fd(vs[0].date.slice(0,10)):'sin registro')}${kpi('Tareas pendientes',ts.length,ts[0]?'próxima '+fds(ts[0].date):'')}</div>
 <div class="grid g-main">
  <div class="grid" style="align-content:start">
   <div class="card"><div class="card-h"><h2>Historial de actividad</h2></div>
    <div class="tabs" id="tl-tabs">${[['todo','Todo'],['v','Visitas'],['q','Cotizaciones y pedidos'],['m','Comunicaciones'],['a','Cambios']].map(([k,l])=>`<button data-tl="${k}" class="${C360tab===k?'on':''}">${l}<span class="c">${tl.filter(filt[k]).length}</span></button>`).join('')}</div>
    <div>${tl.filter(filt[C360tab]).slice(0,40).map(x=>`<div class="list-item ${x.link?'click':''}" ${x.link?`data-go="${x.link}" style="cursor:pointer"`:''}><div class="ic ${icmap[x.k][0]}">${ico(icmap[x.k][1])}</div><div class="grow"><b>${esc(x.t)}</b><div class="small" style="color:var(--fg-2)">${esc(x.s)}</div>${x.k==='v'&&x.extra?`<div class="small muted">Próximo paso: ${esc(x.extra.next)} · seguimiento ${fds(x.extra.followDate)} ${x.extra.photo?' · 📷 foto adjunta':''}${x.extra.gps?' · GPS':''}</div>`:''}<div class="small muted">${fdt(x.ts)} · ${esc(U(x.u).name)}</div></div></div>`).join('')||'<div class="empty">Sin registros.</div>'}</div>
   </div>
   <div class="card"><div class="card-h"><h2>Cotizaciones</h2>${can('cotizar')?`<button class="btn sm" data-act="newQuote" data-client="${id}">${ico('plus')}Nueva</button>`:''}</div>
    ${qs.length?`<div class="tbl-w"><table><thead><tr><th>N°</th><th>Fecha</th><th class="r">Total</th><th>Estado</th><th class="hide-m">Pedido</th></tr></thead><tbody>${qs.map(q=>`<tr class="click" data-go="#cotizacion/${q.id}"><td class="mono small">${q.num}</td><td>${fd(q.date)}</td><td class="r num">${clp(qTotals(q).total)}</td><td>${stPill(q)}</td><td class="hide-m mono small">${q.won?q.won.order:''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Sin cotizaciones.</div>'}
   </div>
  </div>
  <div class="grid" style="align-content:start">
   <div class="card"><h2>Datos del cliente</h2>
    <dl class="kv"><dt>Razón social</dt><dd>${esc(c.razon)}</dd><dt>Giro</dt><dd>${esc(c.giro)}</dd><dt>Dirección</dt><dd>${esc(c.address)}</dd><dt>Teléfono</dt><dd>${esc(c.phone)}</dd><dt>Correo</dt><dd>${esc(c.email)}</dd><dt>Vendedores</dt><dd>${c.sellers.map(s=>`<span class="row" style="margin-bottom:3px">${avatar(s)} ${esc(U(s).name)}</span>`).join('')}</dd><dt>Lista de precios</dt><dd>${esc(L.name)} <span class="muted small">(según región)</span></dd><dt>Creado</dt><dd>${fd(c.createdAt.slice(0,10))} por ${esc(U(c.createdBy).name)}</dd></dl>
   </div>
   <div class="card"><h2>Contactos</h2>${c.contacts.map(k=>`<div class="list-item"><div class="ic">${ico('users')}</div><div class="grow"><b>${esc(k.name)}</b><div class="small muted">${esc(k.role)}</div><div class="small">${esc(k.phone)} · ${esc(k.email)}</div></div></div>`).join('')}</div>
   <div class="card"><div class="card-h"><h2>Oportunidades</h2><a class="small" href="#pipeline">Pipeline →</a></div>${ops.length?ops.map(o=>`<div class="list-item"><div class="grow"><b>${esc(o.name)}</b><div class="small muted">${STAGES.find(s=>s[0]===o.stage)[1]} · ${clp(o.amount)}</div>${o.nextAction?`<div class="small">Próximo paso: ${esc(o.nextAction)} (${fds(o.nextDate)})</div>`:''}</div></div>`).join(''):'<div class="empty">Sin oportunidades.</div>'}</div>
   <div class="card"><h2>Tareas pendientes</h2>${ts.length?ts.map(taskRow).join(''):'<div class="empty">Sin tareas pendientes.</div>'}</div>
  </div>
 </div>`;
 M().onclick=e=>{const t=e.target.closest('[data-tl]');if(t){C360tab=t.dataset.tl;vClient(id)}};
 M().oninput=null;M().onchange=null;
}

 </form>`,`<button class="btn" data-close>Cancelar</button><button class="btn pri" id="cSave">${isNew?'Crear cliente':'Guardar cambios'}</button>`);
 const upd=()=>{const r=$('#f-region').value;$('#listHint').textContent='Lista de precios: '+listFor({region:r}).name};upd();

 $('#addContact').onclick=()=>$('#contacts').insertAdjacentHTML('beforeend',contactRow({name:'',role:'',phone:'',email:''}));
 $('#cSave').onclick=async()=>{

function importXls(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const wb=XLSX.read(r.result,{type:'array'});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
  const key=(o,names)=>{const k=Object.keys(o).find(k=>names.includes(norm(k)));return k?o[k]:''};
  const ch=[];const err=[];rows.forEach((o,i)=>{const code=String(key(o,['codigo','code','sku'])).trim().toUpperCase();const price=+String(key(o,['precio','price','valor'])).replace(/[^\d]/g,'');let list=String(key(o,['lista','region'])).trim();const lid=list?(LISTS.find(l=>norm(l.name)===norm(list)||norm(l.id)===norm(list))||{}).id:curList;
   if(!P(code)){err.push(`Fila ${i+2}: código “${code}” no existe`);return}if(!price){err.push(`Fila ${i+2}: precio vacío`);return}if(!lid){err.push(`Fila ${i+2}: lista “${list}” no reconocida`);return}
   const old=S.lists[lid].prices[code];if(old!==price)ch.push({lid,code,old,price})});
  openModal('Importar lista de precios',`<p>${rows.length} filas leídas de <b>${esc(f.name)}</b>. ${ch.length} precios cambian${err.length?`, ${err.length} filas con error`:''}.</p>${ch.length?`<div class="tbl-w" style="max-height:320px;overflow:auto"><table><thead><tr><th>Lista</th><th>Código</th><th class="r">Actual</th><th class="r">Nuevo</th><th class="r">Var.</th></tr></thead><tbody>${ch.map(c=>`<tr><td>${esc(S.lists[c.lid].name)}</td><td class="mono small">${c.code}</td><td class="r num">${clp(c.old)}</td><td class="r num">${clp(c.price)}</td><td class="r num">${pct(c.price/c.old-1)}</td></tr>`).join('')}</tbody></table></div>`:''}${err.length?`<div class="note warn" style="margin-top:10px">${ico('alert')}<span>${err.slice(0,8).map(esc).join('<br>')}</span></div>`:''}`,`<button class="btn" data-close>Cancelar</button><button class="btn pri" id="impOk" ${ch.length?'':'disabled'}>Aplicar ${ch.length} cambios</button>`);
  $('#impOk').onclick=async()=>{$('#impOk').disabled=true;try{await dbRun(sb.from('crm_price_list_items').upsert(ch.map(c=>({list_id:c.lid,code:c.code,price:c.price})),{onConflict:'list_id,code'}));for(const lid of new Set(ch.map(c=>c.lid)))await dbRun(sb.from('crm_price_lists').update({updated:nowIso(),updated_by:S.me}).eq('id',lid))}catch(e){return}ch.forEach(c=>{S.lists[c.lid].prices[c.code]=c.price;S.lists[c.lid].updated=nowIso();S.lists[c.lid].updatedBy=S.me});audit('Lista de precios',[...new Set(ch.map(c=>S.lists[c.lid].name))].join(', '),'Importación Excel',`${ch.length} precios actualizados desde ${f.name}`);closeModal();vPrices();toast(ch.length+' precios actualizados.')};
 }catch(e){toast('No se pudo leer el archivo. Usa .xlsx o .csv con columnas codigo y precio.')}};r.readAsArrayBuffer(f)}

function barsCompare(per){
 if(!per.length)return '<div class="empty">Sin datos.</div>';
 const W=560,H=240,pl=64,pb=34,pt=10;const max=Math.max(1,...per.map(p=>Math.max(p.cot,p.won)));
 const step=10**Math.floor(Math.log10(max));const nice=[1,2,2.5,5,10].map(m=>m*step).find(v=>v*4>=max)||step*10;const top=nice*4;
 const gw=(W-pl-10)/per.length,bw=Math.min(22,gw/3);
 const y=v=>pt+(H-pt-pb)*(1-v/top);
 return `<div class="legend"><span><i style="background:var(--s1)"></i>Cotizado</span><span><i style="background:var(--s3)"></i>Ganado</span></div><div style="overflow-x:auto"><svg class="chart" viewBox="0 0 ${W} ${H}" style="width:100%;min-width:420px;height:auto" role="img" aria-label="Monto cotizado y ganado por vendedor">
 ${[0,1,2,3,4].map(i=>`<line class="grid-l" x1="${pl}" x2="${W-10}" y1="${y(nice*i)}" y2="${y(nice*i)}"/><text x="${pl-6}" y="${y(nice*i)+4}" text-anchor="end">${clpK(nice*i).replace('$ ','')}</text>`).join('')}
 ${per.map((p,i)=>{const x=pl+gw*i+gw/2;const hC=y(0)-y(p.cot),hW=y(0)-y(p.won);return `<g><title>${esc(p.u.name)}: cotizado ${clp(p.cot)} · ganado ${clp(p.won)}</title><path d="${barPath(x-bw-1,y(0),bw,hC)}" fill="var(--s1)"/><path d="${barPath(x+1,y(0),bw,hW)}" fill="var(--s3)"/><text x="${x}" y="${H-pb+16}" text-anchor="middle">${esc(p.u.name.split(' ')[0])}</text></g>`}).join('')}
 <line class="axis" x1="${pl}" x2="${W-10}" y1="${y(0)}" y2="${y(0)}"/></svg></div>`;
}
function barPath(x,y0,w,h){if(h<=0)return '';const r=Math.min(4,h,w/2);return `M${x},${y0}V${y0-h+r}Q${x},${y0-h} ${x+r},${y0-h}H${x+w-r}Q${x+w},${y0-h} ${x+w},${y0-h+r}V${y0}Z`}
function hbars(rows,color,fmt){rows=rows.filter(r=>r[1]>0);if(!rows.length)return '<div class="empty">Sin datos en el período.</div>';const max=Math.max(...rows.map(r=>r[1]));return `<div class="hbar">${rows.map(([l,v,x])=>`<span class="small" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(l)}">${esc(l)}</span><div class="track"><div class="b" style="width:${v/max*100}%;background:${color}" title="${esc(l)}: ${esc(fmt(v,x))}"></div></div><span class="small num muted">${fmt(v,x)}</span>`).join('')}</div>`}
function funnel(){let ops=RF.seller?S.opps.filter(o=>o.userId===RF.seller):S.opps;ops=ops.filter(o=>!['ganada','perdida'].includes(o.stage)||o.createdAt>=ymd(addD(TODAY,-60)));const rows=STAGES.map(([k,l])=>[l,ops.filter(o=>o.stage===k).length,ops.filter(o=>o.stage===k).reduce((s,o)=>s+o.amount,0)]);return hbars(rows,'var(--s1)',(v,a)=>v+' · '+clpK(a))}

function compressImage(file,max=1280,q=.72){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);cv.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',q);URL.revokeObjectURL(img.src)};img.onerror=rej;img.src=URL.createObjectURL(file)})}
async function downloadPdf(q){
 if(!window.html2pdf){toast('No se pudo cargar el generador de PDF. Revisa tu conexión.');return false}
 const host=document.createElement('div');host.style.cssText='position:fixed;left:-10000px;top:0;width:794px;background:#fff';host.innerHTML=pdfSheet(q);document.body.appendChild(host);
 const el=host.firstElementChild;el.style.boxShadow='none';el.style.maxWidth='794px';
 try{await html2pdf().set({margin:0,filename:q.num+'.pdf',image:{type:'jpeg',quality:.95},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff'},jsPDF:{unit:'pt',format:'a4',orientation:'portrait'},pagebreak:{mode:['avoid-all','css']}}).from(el).save();return true}
 catch(e){console.error(e);toast('No se pudo generar el PDF.');return false}finally{host.remove()}
}
function genPass(){const a='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';const r=crypto.getRandomValues(new Uint8Array(10));return 'TX-'+[...r].map(x=>a[x%a.length]).join('')}

async function callAdmin(body){const {data,error}=await sb.functions.invoke('crm-admin-users',{body});if(error){let msg=error.message;try{const j=await error.context.json();msg=j.error||msg}catch(_){}throw new Error(msg)}if(data&&data.error)throw new Error(data.error);return data}
function credModal(name,email,pass,isNew){openModal(isNew?'Usuario creado':'Contraseña actualizada',`<p>${isNew?'Comparte estos datos con':'Nueva contraseña temporal de'} <b>${esc(name)}</b>. Al entrar puede cambiarla desde su menú de usuario.</p><dl class="kv"><dt>Dirección</dt><dd class="mono small">${esc(location.origin+location.pathname.replace(/crm\.html$/,''))}</dd><dt>Correo</dt><dd class="mono">${esc(email)}</dd><dt>Contraseña</dt><dd class="mono">${esc(pass)}</dd></dl>`,`<button class="btn pri" id="cpyCred">${ico('copy')}Copiar datos</button>`,'narrow');$('#cpyCred').onclick=()=>copyText(`Apps Grupo TX (elige CRM Comercial)\n${location.origin+location.pathname.replace(/crm\.html$/,'')}\nCorreo: ${email}\nContraseña: ${pass}`)}
function passModal(){openModal('Cambiar mi contraseña',`<form class="form" style="grid-template-columns:1fr" onsubmit="return false"><div class="fld"><label>Nueva contraseña</label><input type="password" id="np1" autocomplete="new-password"><span class="hint">Mínimo 8 caracteres.</span></div><div class="fld"><label>Repetir contraseña</label><input type="password" id="np2" autocomplete="new-password"></div></form>`,`<button class="btn" data-close>Cancelar</button><button class="btn pri" id="npOk">Guardar</button>`,'narrow');
 $('#npOk').onclick=async()=>{const a=$('#np1').value,b=$('#np2').value;if(a.length<8){toast('Usa al menos 8 caracteres.');return}if(a!==b){toast('Las contraseñas no coinciden.');return}const {error}=await sb.auth.updateUser({password:a});if(error){toast('No se pudo cambiar: '+error.message);return}closeModal();toast('Contraseña actualizada.')}}

/* ============ auth + boot ============ */
function showGate(html){$('#gate').innerHTML=html;$('#gate').hidden=false;$('.app').hidden=true;$('#bnav').hidden=true;$('#fab').hidden=true}
function hideGate(){$('#gate').hidden=true;$('.app').hidden=false;$('#bnav').hidden=false}
function showLogin(msg){showGate(`<form class="gate-card" id="loginForm"><div class="brand"><div class="mk">TX</div><div><b>CRM Comercial</b><span>Grupo TX</span></div></div><h1>Ingresar</h1>${msg?`<div class="note warn">${esc(msg)}</div>`:''}<div class="fld"><label for="lg-email">Correo</label><input id="lg-email" type="email" autocomplete="username" required></div><div class="fld"><label for="lg-pass">Contraseña</label><input id="lg-pass" type="password" autocomplete="current-password" required></div><button class="btn pri" type="submit" id="lgBtn" style="justify-content:center">Ingresar</button><p class="small muted">Usa el mismo correo y contraseña de las apps Grupo TX. <a href="./">Volver al portal</a></p></form>`);
 $('#loginForm').onsubmit=async e=>{e.preventDefault();const b=$('#lgBtn');b.disabled=true;b.textContent='Ingresando…';const {error}=await sb.auth.signInWithPassword({email:$('#lg-email').value.trim(),password:$('#lg-pass').value});if(error){b.disabled=false;b.textContent='Ingresar';const m=/invalid/i.test(error.message)?'Correo o contraseña incorrectos.':error.message;$('#loginForm .note')?.remove();b.insertAdjacentHTML('beforebegin',`<div class="note warn">${esc(m)}</div>`);return}boot()}}
async function boot(){
 showGate('<div class="gate-card"><div class="brand"><div class="mk">TX</div><div><b>CRM Comercial</b><span>Grupo TX</span></div></div><p class="muted">Cargando datos…</p></div>');
 const {data:{session}}=await sb.auth.getSession();
 if(!session){showLogin();return}
 S.me=session.user.id;
 try{await loadAll()}catch(e){console.error(e);showGate(`<div class="gate-card"><h1>No se pudieron cargar los datos</h1><p class="muted">${esc(e.message||e)}</p><button class="btn pri" onclick="location.reload()">Reintentar</button> <button class="btn" onclick="sb.auth.signOut().then(()=>location.reload())">Cerrar sesión</button></div>`);return}
 const p=S.users.find(u=>u.id===S.me);
 if(!p||!p.active){showGate(`<div class="gate-card"><h1>Sin acceso al CRM</h1><p>Tu cuenta (${esc(session.user.email)}) no tiene acceso al CRM Comercial o está desactivada. Pídele al administrador del CRM que te agregue.</p><div class="row"><a class="btn pri" href="./">Volver al portal</a><button class="btn" onclick="sb.auth.signOut().then(()=>location.href='./')">Cerrar sesión</button></div></div>`);return}
 hideGate();router();
}
sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')location.href='./'});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.me&&Date.now()-lastLoad>60000&&!$('#modalRoot').innerHTML&&!/cotizacion\/nueva/.test(location.hash)&&!S.quotes.some(q=>q._edit))reloadData()});

/* ============ EXPORT ============ */
function exportData(what){if(!can('exportar')){toast('Tu perfil no puede exportar.');return}
 let rows=[];
 if(what==='clientes')rows=[['Nombre','Razón social','RUT','Tipo','Segmento','Región','Comuna','Dirección','Teléfono','Correo','Vendedores','Última visita','Días sin visita'],...visibleClients().map(c=>{const l=lastVisit(c.id);return[c.name,c.razon,c.rut,c.type,c.segment,regName(c.region),c.comuna,c.address,c.phone,c.email,c.sellers.map(s=>U(s).name).join(' / '),l?l.date.slice(0,10):'',daysSince(c.id)>=999?'':daysSince(c.id)]})];
 if(what==='visitas')rows=[['Fecha','Cliente','Vendedor','Motivo','Resultado','Comentarios','Próximo paso','Seguimiento','Lat','Lng'],...visibleVisits().map(v=>[v.date,C(v.clientId).name,U(v.userId).name,v.reason,v.result,v.comments,v.next,v.followDate,v.lat==null?'':(+v.lat).toFixed(5),v.lng==null?'':(+v.lng).toFixed(5)])];
 if(what==='cotizaciones')rows=[['N°','Fecha','Cliente','Vendedor','Estado','Neto','Total','Pedido','Motivo pérdida'],...visibleQuotes().map(q=>{const t=qTotals(q);return[q.num,q.date,C(q.clientId).name,U(q.userId).name,STATUS[qStatus(q)],Math.round(t.neto),Math.round(t.total),q.won?q.won.order:'',q.lost?q.lost.reason:'']})];
 if(what==='productos')rows=[['Código','Nombre','Familia','Unidad','Precio base','Activo'],...S.products.map(p=>[p.code,p.name,p.family,p.unit,p.price,p.active?'Sí':'No'])];
 if(what==='actividad')rows=[['Fecha','Tipo','Vendedor','Cliente','Detalle'],...S.visits.map(v=>[v.date,'Visita',U(v.userId).name,C(v.clientId).name,v.reason]),...S.quotes.map(q=>[q.date,'Cotización',U(q.userId).name,C(q.clientId).name,q.num+' '+STATUS[qStatus(q)]]),...S.tasks.map(t=>[t.date,TASKT[t.type],U(t.userId).name,(C(t.clientId)||{}).name||'',t.title])];
 openModal('Exportar '+what,`<p>${rows.length-1} filas listas para descargar en Excel.</p><div class="tbl-w" style="max-height:300px;overflow:auto"><table><thead><tr>${rows[0].map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.slice(1,11).map(r=>`<tr>${r.map(x=>`<td class="small">${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="small muted">Vista previa de las primeras 10 filas.</p>`,`<button class="btn" id="cpy">${ico('copy')}Copiar</button><button class="btn pri" id="xls">${ico('dl')}Descargar Excel</button>`,'wide');
 $('#cpy').onclick=()=>copyText(rows.map(r=>r.join('\t')).join('\n'));
 $('#xls').onclick=()=>{try{const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=rows[0].map((h,i)=>({wch:Math.min(40,Math.max(10,...rows.slice(0,200).map(r=>String(r[i]??'').length)))}));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,what.slice(0,30));XLSX.writeFile(wb,`CRM_TX_${what}_${ymd(new Date())}.xlsx`);audit('Exportación',what,'Exportado a Excel',rows.length-1+' filas');closeModal()}catch(e){toast('No se pudo generar el Excel.')}}}
function copyText(t){try{navigator.clipboard.writeText(t).then(()=>toast('Copiado. Pégalo en Excel.'),()=>fallbackCopy(t))}catch(e){fallbackCopy(t)}}
function fallbackCopy(t){const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='width:100%;height:160px';const mb=document.querySelector('.mb');if(mb){mb.appendChild(ta);ta.select();toast('Selecciona y copia el texto (Ctrl+C).')}}

/* ============ global search + events ============ */
function gsearch(q){const n=norm(q);if(n.length<2)return null;const res=[];
 visibleClients().filter(c=>norm(c.name+c.razon+c.rut+c.comuna).includes(n)).slice(0,6).forEach(c=>res.push(['Clientes',c.name,c.rut+' · '+c.comuna,'#cliente/'+c.id]));
 visibleQuotes().filter(q=>norm(q.num+C(q.clientId).name).includes(n)).slice(0,5).forEach(q=>res.push(['Cotizaciones',q.num,C(q.clientId).name+' · '+STATUS[qStatus(q)],'#cotizacion/'+q.id]));
 S.products.filter(p=>norm(p.code+p.name+p.family).includes(n)).slice(0,5).forEach(p=>res.push(['Productos',p.code+' · '+p.name,p.unit+' · '+clp(p.price),'#productos']));
 S.users.filter(u=>norm(u.name).includes(n)).slice(0,4).forEach(u=>res.push(['Vendedores',u.name,ROLES[u.role],can('dash_equipo')?'#reportes':'#inicio']));
 visibleVisits().filter(v=>norm(C(v.clientId).name+v.reason).includes(n)).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4).forEach(v=>res.push(['Visitas',C(v.clientId).name,fdt(v.date)+' · '+v.reason,'visit:'+v.id]));
 return res}
$('#gsearch').addEventListener('input',e=>{const r=gsearch(e.target.value);const box=$('#sres');if(!r){box.hidden=true;return}let g='';box.innerHTML=r.length?r.map(([grp,t,s,go])=>{const h=grp!==g?`<div class="g">${grp}</div>`:'';g=grp;return h+`<button data-sgo="${go}"><span><b>${esc(t)}</b><br><span class="small muted">${esc(s)}</span></span></button>`}).join(''):'<div class="empty">Sin resultados.</div>';box.hidden=false});
$('#sres').addEventListener('click',e=>{const b=e.target.closest('[data-sgo]');if(!b)return;const go=b.dataset.sgo;$('#sres').hidden=true;$('#gsearch').value='';if(go.startsWith('visit:'))showVisit(go.slice(6));else location.hash=go});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('#sres').hidden=true;if(!e.target.closest('#notif')&&!e.target.closest('#bellBtn'))$('#notif').hidden=true;
 const go=e.target.closest('[data-go]');if(go&&!e.target.closest('a,button:not([data-go]),input,select')){location.hash=go.dataset.go;return}
 const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act,id=a.dataset.id,cl=a.dataset.client;
 ({newClient:()=>can('crear_cliente')?clientForm():toast('Tu perfil no puede crear clientes.'),editClient:()=>clientForm(C(id)),newVisit:()=>visitForm(cl),newQuote:()=>newQuote(cl),newTask:()=>taskForm(cl),newComm:()=>commForm(cl),win:()=>winModal(id),lose:()=>loseModal(id),pdf:()=>pdfModal(id),mailQ:()=>mailQModal(id),dupQ:()=>{newQuote(null,id);toast('Cotización duplicada. Edita lo necesario y guarda; la original no cambia.')},editQ:()=>{const q=S.quotes.find(q=>q.id===id);q._bak=JSON.parse(JSON.stringify(q));q._edit=true;rerender()},approve:()=>{const q=S.quotes.find(x=>x.id===id);q.status='enviada';q.history.push({ts:nowIso(),user:S.me,text:'Descuentos aprobados'});saveQ(q);audit('Cotización',q.num,'Descuento aprobado','');rerender();toast('Descuentos aprobados.')},export:()=>exportData(a.dataset.what),newProduct:()=>productForm(),editProduct:()=>productForm(id),toggleProduct:()=>{const p=P(id);p.active=!p.active;p.updatedBy=S.me;p.updatedAt=nowIso();dbUpd('products',p,['active','updatedBy','updatedAt'],'code').catch(ignore);audit('Producto',p.code,p.active?'Activado':'Desactivado','Activo: '+(p.active?'no → sí':'sí → no'));rerender()},tplXls:tplModal}[act]||(()=>{}))();
});
document.addEventListener('change',e=>{const t=e.target.dataset.taskDone;if(t){const k=S.tasks.find(x=>x.id===t);k.done=e.target.checked;dbUpd('tasks',k,['done']).catch(ignore);toast(k.done?'Actividad completada.':'Actividad reabierta.');setTimeout(rerender,250)}});
$('#userBtn').addEventListener('click',()=>{const m=$('#umenu');if(!m.hidden){m.hidden=true;return}m.innerHTML=`<div class="hd"><b>${esc(me().name)}</b><div class="muted small">${esc(me().email)} · ${ROLES[me().role]}</div></div><button data-um="pass">${ico('edit')}Cambiar mi contraseña</button><button data-um="reload">${ico('hist')}Actualizar datos</button><button data-um="portal">${ico('home')}Ir al portal de apps</button><button data-um="out">${ico('x')}Cerrar sesión</button>`;m.hidden=false});
$('#umenu').addEventListener('click',async e=>{const b=e.target.closest('[data-um]');if(!b)return;$('#umenu').hidden=true;const a=b.dataset.um;if(a==='pass')passModal();if(a==='reload'){await reloadData();toast('Datos actualizados.')}if(a==='portal')location.href='./';if(a==='out'){await sb.auth.signOut();location.href='./'}});
document.addEventListener('click',e=>{if(!e.target.closest('#umenu')&&!e.target.closest('#userBtn'))$('#umenu').hidden=true});
$('#bellBtn').addEventListener('click',()=>{const n=$('#notif');if(!n.hidden){n.hidden=true;return}const al=alertsFor();n.innerHTML=`<h3>Alertas (${al.length})</h3>`+(al.map(a=>`<div class="it" data-ngo="${a.go}"><div class="ic ${a.k==='q'?'q':a.k==='t'?'t':'l'}">${ico(a.k==='q'?'doc':a.k==='t'?'clock':'alert')}</div><div><b class="small">${esc(a.text)}</b><div class="small muted">${esc(a.sub)}</div></div></div>`).join('')||'<div class="empty">Sin alertas.</div>');n.hidden=false});
$('#notif').addEventListener('click',e=>{const i=e.target.closest('[data-ngo]');if(i){location.hash=i.dataset.ngo;$('#notif').hidden=true}});
$('#menuBtn').addEventListener('click',()=>$('#side').classList.toggle('open'));
$('#bnav').addEventListener('click',e=>{const b=e.target.closest('[data-bnav]');if(!b)return;if(b.dataset.bnav==='__menu')$('#side').classList.toggle('open');else location.hash='#'+b.dataset.bnav});
$('#fab').addEventListener('click',()=>visitForm());
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();$('#side').classList.remove('open')}});
window.addEventListener('hashchange',router);
boot();
</script>
