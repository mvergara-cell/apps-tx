<style>
:root{--brand:#e4032e;--brand-ink:#fff;--brand-soft:#fde7eb;--red:var(--brand);--bg:#f2f2f0;--card:#ffffff;--sunk:#eaeae7;--ink:#121212;--mute:#5e6066;--line:#dfdfdb;--gray:#8d939a;--ok:#18864a;--ok-soft:#ddf2e5;--warn:#b86e00;--warn-soft:#fbeed6;
  --f-ui:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--brand:#ff2a4d;--brand-soft:#3a0f18;--bg:#0c0d0f;--card:#15171a;--sunk:#1d2024;--ink:#f1f1f1;--mute:#9a9da4;--line:#2a2d32;--gray:#6b7178;--ok:#4fd18a;--ok-soft:#13301f;--warn:#f2b04a;--warn-soft:#352813;color-scheme:dark}}
:root[data-theme="dark"]{--brand:#ff2a4d;--brand-soft:#3a0f18;--bg:#0c0d0f;--card:#15171a;--sunk:#1d2024;--ink:#f1f1f1;--mute:#9a9da4;--line:#2a2d32;--gray:#6b7178;--ok:#4fd18a;--ok-soft:#13301f;--warn:#f2b04a;--warn-soft:#352813;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:var(--f-ui);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:14px;padding:12px 20px;max-width:1100px;margin:0 auto}
.txmark{width:58px;flex:none;color:var(--ink);display:block}
.ttl{display:flex;flex-direction:column;margin-right:auto;min-width:0;line-height:1.15}
.ttl small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);font-weight:700}
.ttl h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:99px;padding:4px 12px 4px 4px;color:var(--ink);text-decoration:none;font-size:13px}
.uchip .av{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:11.5px;font-weight:700}
.uchip .un{display:grid;line-height:1.15}.uchip .un b{font-size:12.5px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.uchip .un small{font-size:10.5px;color:var(--mute)}
#estado-conexion{font-size:12px;color:var(--mute)}
nav{display:flex;gap:6px;padding:0 20px 10px;overflow-x:auto;max-width:1100px;margin:0 auto;scrollbar-width:none}
nav button{flex:none;border:1px solid transparent;background:transparent;color:var(--mute);padding:8px 14px;border-radius:10px;font-weight:600;font-size:13.5px;cursor:pointer}
nav button:hover{color:var(--ink);background:var(--sunk)}
nav button.on{background:var(--brand-soft);color:var(--brand)}
@media (max-width:560px){.topin{padding:10px 14px;gap:10px}.txmark{width:44px}.ttl h1{font-size:17px}.uchip{padding:3px;border:0}.uchip .un{display:none}nav{padding:0 14px 10px}}
main{padding:20px;max-width:1100px;margin:0 auto}
@media (max-width:560px){main{padding:14px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
h2{margin:0 0 12px;font-size:19px;font-weight:800;letter-spacing:-.01em}
h3{margin:20px 0 8px;font-size:15px;font-weight:700}
.mute{color:var(--mute);font-size:13px}
label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--mute);margin:14px 0 6px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea{min-height:84px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.row{grid-template-columns:1fr}}
.btn{background:var(--brand);color:var(--brand-ink);border:1px solid var(--brand);border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.6;cursor:wait}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
.acciones{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;background:var(--card);color:var(--ink)}
.chip input{display:none}
.chip:has(input:checked),.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.checks{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.check{display:flex;gap:10px;align-items:flex-start;color:var(--ink);font-size:14px;margin:0;text-transform:none;letter-spacing:0;font-weight:500}
.check input{width:auto;margin-top:4px;accent-color:var(--brand)}
.part{display:grid;grid-template-columns:1fr 1.6fr 1fr auto auto;gap:6px;align-items:center;margin-bottom:6px}
.part .pf{margin:0;display:flex;align-items:center;gap:4px;color:var(--ink);font-size:13px;white-space:nowrap;text-transform:none;letter-spacing:0;font-weight:500}
.part .pf input{width:auto;accent-color:var(--brand)}
.part .x{background:transparent;border:1px solid var(--line);border-radius:10px;color:var(--mute);padding:9px 11px;cursor:pointer}
@media (max-width:560px){.part{grid-template-columns:1fr 1fr}.part .pi-nombre{grid-column:1/-1}}
.ac{position:relative}
.sug{position:absolute;left:0;right:0;top:100%;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:4px;max-height:280px;overflow:auto;box-shadow:0 18px 40px -16px rgba(0,0,0,.45)}
.sug button{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--ink);padding:10px 12px;cursor:pointer;font-weight:600}
.sug button:hover{background:var(--sunk)}
.sug button:last-child{border-bottom:0}
.sug button small{color:var(--mute);display:block;font-weight:400;font-family:var(--f-mono);font-size:11.5px}
.sug button.nuevo{color:var(--brand)}
.cli-ok{font-size:12px;color:var(--ok);margin-top:6px;font-family:var(--f-mono)}
.cli-new{font-size:12px;color:var(--brand);margin-top:6px}
.hero{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px;opacity:.45;-webkit-mask-image:linear-gradient(115deg,transparent 35%,#000);mask-image:linear-gradient(115deg,transparent 35%,#000);pointer-events:none}
.hero>*{position:relative}
.hero .eb{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);font-weight:700}
.hero h2{font-size:24px;margin:6px 0 4px}
.hero .acciones{margin-top:14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi span{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:700}
.kpi b{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi small{display:block;font-size:12px;color:var(--mute);font-family:var(--f-mono)}
.kpi.hot b{color:var(--brand)}
.graficos{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:700px){.graficos{grid-template-columns:1fr}}
.chart-box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;position:relative;min-height:260px}
.chart-box h3{margin:0 0 10px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.chart-box .cv{position:relative;height:220px}
.chart-box.ancho{grid-column:1/-1}
.tag{display:inline-block;font-family:var(--f-mono);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:3px 8px;border-radius:99px;background:var(--sunk);color:var(--mute);margin-right:8px;vertical-align:2px}
.tag.v{color:var(--brand);background:var(--brand-soft)}
.aviso{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.fotos{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.fotos a{display:block;width:72px;height:72px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--sunk)}
.fotos img{width:100%;height:100%;object-fit:cover;display:block}
details.mas summary{cursor:pointer;color:var(--brand);font-size:13px;font-weight:600;margin-top:8px}
details.mas p{margin:6px 0}
.acc{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.acc:last-child{border-bottom:0}
.acc small{display:block;color:var(--mute);font-family:var(--f-mono);font-size:11.5px}
.sw{position:relative;width:46px;height:26px;flex:none;margin:0}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.2s;cursor:pointer}
.sw span:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+span{background:var(--brand)}
.sw input:checked+span:before{transform:translateX(20px)}
.gate{max-width:420px;margin:48px auto;padding:24px}
.gate .txmark{width:110px;margin-bottom:18px}
.del{background:transparent;border:0;color:var(--mute);font-size:12px;cursor:pointer;text-decoration:underline;float:right}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;transition:transform .25s;font-size:14px;max-width:90%;z-index:20}
#toast.on{transform:translateX(-50%) translateY(0)}
.ttl small::before{content:"";display:inline-block;width:7px;height:7px;border-radius:2px;background:#1fb3b5;margin-right:7px;vertical-align:1px;box-shadow:0 0 10px #1fb3b5}
</style>

/* ===================== Utilidades ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const hoy = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const fmtFecha = f => f ? String(f).slice(0,10).split('-').reverse().join('-') : '';
const mesKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('on'), 2600);
}
function setConexion(html){ const el = $('#estado-conexion'); if (el) el.innerHTML = html; }

/* ===================== Sesión y acceso ===================== */
function pantallaLogin(msg){
  $('#nav').hidden = true;
  setConexion(EN_PORTAL ? '' : '<a href="./">Portal</a>');
  $('#app').innerHTML = `<form class="card gate" id="login">
    <span class="txmark">${$('.topbar .txmark').innerHTML}</span>
    <h2>Ingresar</h2>
    ${msg ? `<div class="aviso">${esc(msg)}</div>` : ''}
    <label>Correo</label><input id="lg-email" type="email" autocomplete="username" required>
    <label>Contraseña</label><input id="lg-pass" type="password" autocomplete="current-password" required>
    <div class="acciones"><button class="btn" id="lg-btn" type="submit">Ingresar</button></div>
    <p class="mute">Usa el mismo correo y contraseña de las apps Grupo TX.</p>
  </form>`;
  $('#login').onsubmit = async e => {
    e.preventDefault();
    const b = $('#lg-btn'); b.disabled = true; b.textContent = 'Ingresando…';
    const { error } = await sb.auth.signInWithPassword({ email: $('#lg-email').value.trim(), password: $('#lg-pass').value });
    if (error) return pantallaLogin(/invalid/i.test(error.message) ? 'Correo o contraseña incorrectos.' : error.message);
    iniciar();
  };
}

async function iniciar(){
  setConexion('Conectando…');
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return pantallaLogin();
  const [acc, prof] = await Promise.all([
    sb.rpc('rt_tengo_acceso'),
    sb.from('profiles').select('nombre,email,rol,activo').eq('id', session.user.id).maybeSingle()
  ]);
  const p = prof.data || {};
  me = { id: session.user.id, email: session.user.email,
         nombre: p.nombre || session.user.user_metadata?.nombre || session.user.email.split('@')[0],
         admin: !!(p.activo && p.rol === 'admin') };
  if (acc.error || !acc.data) {
    $('#nav').hidden = true;
    setConexion(esc(me.nombre));
    $('#app').innerHTML = `<div class="card gate"><h2>Sin acceso a Registro de Terreno</h2>
      <p>Tu cuenta (${esc(me.email)}) todavía no tiene acceso a este módulo. Pídele al administrador que te habilite en la pestaña <b>Accesos</b>.</p>
      <div class="acciones">${EN_PORTAL ? '' : '<a class="btn" href="./">Volver al portal</a>'}
      <button class="btn ghost" onclick="sb.auth.signOut().then(()=>location.reload())">Cerrar sesión</button></div></div>`;
    return;
  }
  $('#nav').hidden = false;
  $('#nav-accesos').hidden = !me.admin;
  setConexion(`<a class="uchip" ${EN_PORTAL ? '' : 'href="./" title="Volver al portal"'}><span class="av">${esc(iniciales(me.nombre))}</span><span class="un"><b>${esc(me.nombre)}</b><small>${me.admin ? 'Administrador' : 'Product Manager'}</small></span></a>`);
  render();
  await cargar();
  sb.rpc('rt_productos').then(({ data }) => { if (data && data.length) catalogo = data; });
}

async function cargar(){
  const { data, error } = await sb.from('registros').select('*').order('fecha', { ascending: false }).order('created_at', { ascending: false }).limit(2000);
  if (error) { setConexion('Error de conexión'); toast('No se pudieron cargar los registros'); return; }
  registros = data.map(r => ({ ...(r.datos || {}), id: r.id, kind: r.kind, fecha: r.fecha, cliente: r.cliente, cliente_id: r.cliente_id,
    obra: r.obra, estado: r.estado, fotos: r.fotos || [], autor: r.autor, autor_nombre: r.autor_nombre, creado: r.created_at }));
  ultimaCarga = Date.now();
  if (vista === 'panel' || vista === 'registros') render();
}

/* ===================== Buscador de clientes (base única Silos / CRM) ===================== */
let sugeridos = [];
const buscarClientes = debounce(async (input) => {
  const box = input.parentElement.querySelector('.sug');
  const q = input.value.trim();
  if (q.length < 2) { box.hidden = true; return; }
  const { data, error } = await sb.rpc('rt_buscar_clientes', { q });
  if (input.value.trim() !== q) return;
  sugeridos = error ? [] : (data || []);
  const exacto = sugeridos.some(c => norm(c.nombre) === norm(q));
  let html = sugeridos.map(c => `<button type="button" class="sug-i" data-id="${esc(c.id)}">
      ${esc(c.nombre)}<small>${[c.rut, c.comuna, c.vendedor && 'Vendedor: ' + c.vendedor].filter(Boolean).map(esc).join(' · ')}</small></button>`).join('');
  if (!exacto) html += `<button type="button" class="sug-i nuevo" data-nuevo="1">+ Crear cliente nuevo: “${esc(q)}”</button>`;
  box.innerHTML = html;
  box.hidden = false;
}, 250);

async function elegirCliente(id){
  const c = sugeridos.find(x => x.id === id);

}

function leerCampos(){
  const d = {};
  document.querySelectorAll('#form [name]').forEach(el => {
    const n = el.name;
    if (el.type === 'checkbox') { d[n] = d[n] || []; if (el.checked) d[n].push(el.value); }
    else if (el.type === 'file') d[n] = [...el.files];
    else d[n] = el.value.trim();
  });
  return d;
}

function leerParticipantes(){
  return [...document.querySelectorAll('#partics .part')].map(row => ({
    rut: row.querySelector('.pi-rut').value.trim(),
    nombre: row.querySelector('.pi-nombre').value.trim(),
    cargo: row.querySelector('.pi-cargo').value.trim(),
    firma: row.querySelector('.pi-firma').checked
  })).filter(p => p.rut || p.nombre);
}

// Reduce la foto antes de subirla (máx. 1600 px, JPEG)
function comprimir(file){
  return new Promise(res => {
    if (!/^image\//.test(file.type)) return res(file);
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => res(b || file), 'image/jpeg', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}

async function guardar(kind, btn){
  const d = leerCampos();
  if (!d.fecha) return toast('Falta la fecha');
  if (!d.cliente) return toast('Indica el cliente');
  if (kind === 'visita') { if (!d.motivo) return toast('Describe el motivo del reclamo'); }
  else if (!d.nombre) return toast('Falta el nombre de la actividad');

  btn.disabled = true; const txt = btn.textContent; btn.textContent = 'Guardando…';
  try {
    /* Cliente: si no se eligió de la base, se crea (o se reutiliza si ya existe ese RUT/nombre) */
    let clienteId = cliSel && norm(cliSel.nombre) === norm(d.cliente) ? cliSel.id : null;
    if (!clienteId) {
      const { data, error } = await sb.rpc('rt_crear_cliente', { p_nombre: d.cliente, p_rut: d.cli_rut || '', p_comuna: d.cli_comuna || '', p_direccion: d.direccion || '' });
      if (error) throw error;
      clienteId = data;
    }

    const id = crypto.randomUUID();
    const fotos = [];
    if (kind === 'visita' && d.fotos && d.fotos.length) {
      for (let i = 0; i < d.fotos.length; i++) {
        btn.textContent = `Subiendo foto ${i + 1} de ${d.fotos.length}…`;
        const blob = await comprimir(d.fotos[i]);
        const path = `${id}/${i + 1}-${Date.now()}.jpg`;
        const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType: blob.type || 'image/jpeg' });
        if (error) throw error;
        fotos.push(path);
      }
    }

    const datos = { observaciones: d.observaciones || '' };
    if (kind === 'visita') {
      Object.assign(datos, {
        direccion: d.direccion || '', contacto: d.contacto || '', producto: d.producto || '',
        motivo: d.motivo, verificacion: d.verificacion || '', causa: d.causa || '',
        solucion: d.solucion || '', lab: d.lab || 'No'
      });
    } else {
      Object.assign(datos, {
        nombre: d.nombre, duracion: d.duracion || '60', relator: d.relator || '',
        cargo: d.cargo || '', temas: d.temas || [],
        tipo_act: kind === 'capacitacion' ? (d.tipo_act || 'Capacitación') : 'Charla técnica',
        participantes: leerParticipantes()
      });
    }

    const { error } = await sb.from('registros').insert({
      id, kind, fecha: d.fecha, cliente: d.cliente, cliente_id: clienteId, obra: d.obra || '',
      estado: kind === 'visita' ? (d.estado || 'Abierto') : null,
      datos, fotos, autor: me.id, autor_nombre: me.nombre
    });
    if (error) throw error;
    toast('Registro guardado');
    cliSel = null; cliNuevo = false;
    vista = kind === 'visita' ? 'registros' : 'panel';
    render(); window.scrollTo(0, 0);
    cargar();
  } catch(e){
    btn.disabled = false; btn.textContent = txt;
    toast('No se pudo guardar: ' + (e.message || e.code || 'error'));
  }
}

async function cambiarEstado(id, estado){
  const r = registros.find(x => x.id === id); if (!r || r.estado === estado) return;
  const antes = r.estado; r.estado = estado; render();
  const { error } = await sb.from('registros').update({ estado, updated_at: new Date().toISOString() }).eq('id', id);
  if (error) { r.estado = antes; render(); toast('No se pudo actualizar el estado'); }
}

async function eliminar(id){
  const r = registros.find(x => x.id === id); if (!r) return;
  if (!confirm('¿Eliminar este registro? No se puede deshacer.')) return;
  const { error } = await sb.from('registros').delete().eq('id', id);
  if (error) return toast('No se pudo eliminar');
  registros = registros.filter(x => x.id !== id); render(); toast('Registro eliminado');
}

const contar = (arr, fn) => arr.reduce((m, x) => { const k = fn(x); if (k) m[k] = (m[k] || 0) + 1; return m; }, {});
const topN = (obj, n) => Object.entries(obj).sort((a,b) => b[1] - a[1]).slice(0, n);
const corto = s => s.length > 28 ? s.slice(0, 27) + '…' : s;

function dibujarGraficos(){
  if (!registros.length) return;
  if (typeof Chart === 'undefined') {
    document.querySelectorAll('.chart-box').forEach(b => b.insertAdjacentHTML('beforeend', '<p class="mute">Gráficos no disponibles en este momento.</p>'));
    return;
  }
  Object.values(charts).forEach(c => c.destroy());
  charts = {};
  const cs = getComputedStyle(document.documentElement);
  Chart.defaults.color = cs.getPropertyValue('--mute').trim() || '#6b6b70';
  Chart.defaults.borderColor = cs.getPropertyValue('--line').trim() || '#dcdcdf';
  Chart.defaults.font.family = 'Sora, system-ui, -apple-system, Segoe UI, sans-serif';
  Chart.defaults.elements.bar.borderRadius = 6;
  Chart.defaults.plugins.legend.labels.boxWidth = 10;
  const inkC = cs.getPropertyValue('--ink').trim() || '#1d1d1f';

  const meses = [];
  const hoyD = new Date();
  for (let i = 5; i >= 0; i--) meses.push(mesKey(new Date(hoyD.getFullYear(), hoyD.getMonth() - i, 1)));
  const labels = meses.map(m => { const [y, mo] = m.split('-'); return new Date(+y, +mo - 1, 1).toLocaleDateString('es-CL', { month: 'short', year: '2-digit' }); });
  const porMes = kind => meses.map(m => registros.filter(r => r.kind === kind && String(r.fecha || '').startsWith(m)).length);
  charts.mes = new Chart($('#g-mes'), {
    type: 'bar',
    data: { labels, datasets: [
      { label: 'Charlas técnicas', data: porMes('charla'), backgroundColor: COLOR.charla },
      { label: 'Capacitaciones', data: porMes('capacitacion'), backgroundColor: inkC },
      { label: 'Visitas', data: porMes('visita'), backgroundColor: COLOR.visita }
    ]},
    options: { responsive: true, maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true, ticks: { precision: 0 } } } }
  });

  const visitas = registros.filter(r => r.kind === 'visita');
  const est = contar(visitas, r => r.estado || 'Abierto');
  charts.estado = new Chart($('#g-estado'), {
    type: 'doughnut',
    data: { labels: ESTADOS, datasets: [{ data: ESTADOS.map(e => est[e] || 0), backgroundColor: [getComputedStyle(document.documentElement).getPropertyValue('--brand').trim() || '#e4032e','#f2b04a','#4fd18a'] }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
  });

  const causasTop = topN(contar(visitas, r => r.causa || 'Sin dato'), 6);
  charts.causas = new Chart($('#g-causas'), {
    type: 'bar',
    data: { labels: causasTop.map(c => corto(c[0])), datasets: [{ label: 'Visitas', data: causasTop.map(c => c[1]), backgroundColor: inkC }] },
    options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, ticks: { precision: 0 } } } }
  });

  const pm = topN(contar(registros, r => nombreAutor(r)), 10);
  charts.pm = new Chart($('#g-pm'), {
    type: 'bar',
    data: { labels: pm.map(p => p[0]), datasets: [{ label: 'Registros', data: pm.map(p => p[1]), backgroundColor: COLOR.charla }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
  });

  const cli = topN(contar(registros, r => r.cliente), 8);
  charts.clientes = new Chart($('#g-clientes'), {
    type: 'bar',
    data: { labels: cli.map(c => corto(c[0])), datasets: [{ label: 'Registros', data: cli.map(c => c[1]), backgroundColor: COLOR.visita }] },
    options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, ticks: { precision: 0 } } } }
  });
}

/* ===================== Registros ===================== */
const puedeBorrar = r => me && (me.admin || r.autor === me.id);

function tarjeta(r){
  const autor = `<span class="mute"> · ${esc(nombreAutor(r))}</span>`;
  const del = puedeBorrar(r) ? `<button class="del" data-a="eliminar" data-id="${esc(r.id)}">Eliminar</button>` : '';
  if (r.kind === 'visita') {
    return `<div class="card">${del}
      <span class="tag v">Visita</span><b>${esc(r.cliente)}</b>${autor}
      <p class="mute">${esc(r.obra || '')} · ${fmtFecha(r.fecha)} · ${esc(r.producto || '')}</p>
      <p><b>Motivo:</b> ${esc(r.motivo)}</p>
      <p><b>Causa probable:</b> ${esc(r.causa || '—')}${r.lab === 'Sí' ? ' · Requiere laboratorio' : ''}</p>
      ${(r.verificacion || r.solucion || r.contacto || r.direccion || r.observaciones) ? `<details class="mas"><summary>Ver detalle</summary>
        ${r.direccion ? `<p><b>Dirección:</b> ${esc(r.direccion)}</p>` : ''}
        ${r.contacto ? `<p><b>Contacto:</b> ${esc(r.contacto)}</p>` : ''}
        ${r.verificacion ? `<p><b>Verificación:</b> ${esc(r.verificacion)}</p>` : ''}
        ${r.solucion ? `<p><b>Solución ofrecida:</b> ${esc(r.solucion)}</p>` : ''}
        ${r.observaciones ? `<p><b>Observaciones:</b> ${esc(r.observaciones)}</p>` : ''}
      </details>` : ''}
      ${r.fotos && r.fotos.length ? `<div class="fotos" data-fotos="${esc(r.id)}">${r.fotos.map(p => `<a target="_blank" rel="noopener" data-path="${esc(p)}"><img alt="Foto de la visita"></a>`).join('')}</div>` : ''}
      <div class="chips" style="margin-top:10px">${ESTADOS.map(e => `<button class="chip ${r.estado === e ? 'on' : ''}" data-a="estado" data-id="${esc(r.id)}" data-e="${e}">${e}</button>`).join('')}</div>
    </div>`;
  }
  const parts = r.participantes || [];
  return `<div class="card">${del}
    <span class="tag">${esc(r.kind === 'charla' ? 'Charla técnica' : r.tipo_act || 'Capacitación')}</span><b>${esc(r.nombre || 'Sin nombre')}</b>${autor}
    <p class="mute">${esc(r.cliente)} · ${esc(r.obra || '')} · ${fmtFecha(r.fecha)}</p>
    <p>${parts.length} participantes · ${esc(r.duracion)} min · ${esc(r.relator || '—')}</p>
    ${r.observaciones ? `<p class="mute">${esc(r.observaciones)}</p>` : ''}
    ${parts.length ? `<details class="mas"><summary>Ver participantes</summary>${parts.map(p => `<p>${esc(p.nombre)} <span class="mute">${esc([p.rut, p.cargo].filter(Boolean).join(' · '))}${p.firma ? ' · firmó' : ''}</span></p>`).join('')}</details>` : ''}
  </div>`;
}

function vistaRegistros(){
  const filtros = [['todos','Todos'],['charla','Charlas técnicas'],['capacitacion','Capacitaciones'],['visita','Visitas'],['abiertos','Abiertas'],['mios','Mis registros']];
  const lista = registros.filter(r =>
    filtro === 'todos' ||
    (filtro === 'charla' && r.kind === 'charla') ||
    (filtro === 'capacitacion' && r.kind === 'capacitacion') ||
    (filtro === 'visita' && r.kind === 'visita') ||
    (filtro === 'abiertos' && r.kind === 'visita' && r.estado !== 'Cerrado') ||
    (filtro === 'mios' && r.autor === me?.id)
  );
  return `<div class="chips">${filtros.map(([k,l]) => `<button class="chip ${filtro === k ? 'on' : ''}" data-a="filtro" data-f="${k}">${l}</button>`).join('')}</div>
    <div style="margin-top:12px">${lista.length ? lista.map(tarjeta).join('') : '<p class="mute">Sin registros todavía.</p>'}</div>`;
}

async function cargarFotos(){
  const links = [...document.querySelectorAll('.fotos a[data-path]')];
  const faltan = [...new Set(links.map(a => a.dataset.path).filter(p => !urlCache[p]))];
  if (faltan.length) {
    const { data } = await sb.storage.from(BUCKET).createSignedUrls(faltan, 3600);
    (data || []).forEach(x => { if (x.signedUrl) urlCache[x.path] = x.signedUrl; });
  }
  links.forEach(a => { const u = urlCache[a.dataset.path]; if (u) { a.href = u; a.querySelector('img').src = u; } });
}

/* ===================== Accesos (solo administradores) ===================== */
function vistaAccesos(){
  return `<div class="card"><h2>Accesos al módulo</h2>
    <p class="mute">Activa a los Product Managers que deben registrar charlas, capacitaciones y visitas. Todos los habilitados ven todos los registros. Los administradores entran siempre. Si alguien no aparece, primero debe crear su cuenta en el portal de Apps Grupo TX.</p>
    <div id="acc-lista">${accesos.length ? accesos.map(u => `<div class="acc"><div><b>${esc(u.nombre || u.email)}</b><small>${esc(u.email)}${u.rol === 'admin' ? ' · administrador' : ''}</small></div>
      <label class="sw" title="Acceso"><input type="checkbox" data-acc="${esc(u.id)}" ${u.acceso || u.rol === 'admin' ? 'checked' : ''} ${u.rol === 'admin' ? 'disabled' : ''}><span></span></label></div>`).join('') : '<p class="mute">Cargando…</p>'}</div></div>`;
}
async function cargarAccesos(){
  const { data, error } = await sb.rpc('rt_accesos');
  if (error) return toast('No se pudo cargar la lista de usuarios');
  accesos = data || [];
  if (vista === 'accesos') render();
}

/* ===================== Eventos ===================== */
const acciones = {
  nav: b => { vista = b.dataset.v; cliSel = null; cliNuevo = false; render(); window.scrollTo(0,0); if (vista === 'accesos') cargarAccesos(); },
  addPart: () => $('#partics').insertAdjacentHTML('beforeend', filaPart()),
  delPart: b => b.closest('.part').remove(),
  guardar: b => guardar(b.dataset.t, b),
  filtro: b => { filtro = b.dataset.f; render(); },
  estado: b => cambiarEstado(b.dataset.id, b.dataset.e),
  eliminar: b => eliminar(b.dataset.id)
};

document.addEventListener('click', e => {
  const sug = e.target.closest('.sug-i');
  if (sug) {
    if (sug.dataset.nuevo) { sug.closest('.sug').hidden = true; cliSel = null; cliNuevo = true; infoCliente(); }
    else elegirCliente(sug.dataset.id);
    return;
  }
  if (!e.target.closest('.ac')) document.querySelectorAll('.sug').forEach(s => s.hidden = true);
  const b = e.target.closest('[data-a]');
  if (b && acciones[b.dataset.a]) acciones[b.dataset.a](b);
});

document.addEventListener('input', e => {
  if (e.target.matches('[data-cli]')) {
    if (cliSel && norm(cliSel.nombre) !== norm(e.target.value)) { cliSel = null; infoCliente(); }
    buscarClientes(e.target);
  }
});

document.addEventListener('change', async e => {
  const t = e.target;
  if (t.matches('[data-acc]')) {
    t.disabled = true;
    const { error } = await sb.rpc('rt_set_acceso', { p_id: t.dataset.acc, p_activo: t.checked });
    t.disabled = false;
    if (error) { t.checked = !t.checked; return toast('No se pudo guardar el acceso'); }
    const u = accesos.find(x => x.id === t.dataset.acc); if (u) u.acceso = t.checked;
    toast(t.checked ? 'Acceso habilitado' : 'Acceso retirado');
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.querySelectorAll('.sug').forEach(s => s.hidden = true);
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && me && Date.now() - ultimaCarga > 60000 && (vista === 'panel' || vista === 'registros')) cargar();
});
sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') location.reload(); });

/* ===================== Render ===================== */
function render(){
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === vista));
  const vistas = {
    panel: vistaPanel,
    charla: () => formActividad('charla'),
    capacitacion: () => formActividad('capacitacion'),
    visita: formVisita,
    registros: vistaRegistros,
    accesos: vistaAccesos
  };
  if (vista === 'accesos' && !me?.admin) vista = 'panel';
  $('#app').innerHTML = vistas[vista]();
  const vt = $('#view-title'); if (vt) vt.textContent = TITULOS[vista] || '';
  if (vista === 'panel') dibujarGraficos();
  if (vista === 'registros') cargarFotos();
}

iniciar();
</script>
</body>
</html>
